version: 2

updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
    # A Python major is a reading task, not an auto-merge: it can change runtime
    # behaviour under a service that is deployed as an editable install. Minor,
    # patch and security PRs still open normally, which is what keeps vikunja#228
    # from recurring.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    # Majors are NOT ignored here, unlike pip above. Both workflows pin actions
    # to commit SHAs, and Dependabot is the only thing that will ever move them —
    # ignoring majors would pin this repo to actions/checkout v4 indefinitely.
    # An action major is also a CI-only change: it cannot reach production, and
    # it fails visibly in the PR rather than silently at runtime.
    # SECURITY[accepted]: no semver-major ignore here, and that's deliberate (reasons above). It
    # was re-confirmed when checkout 4->7 and setup-python 5->7 merged (#8/#9). A plan item to
    # add the ignore "to match the other repos" was declined. Audit: 2026-10-07/
    # dependabot-sweep-2026-10-p4-deferred-majors (F-02, Info).
