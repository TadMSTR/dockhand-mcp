# Secret scanning (repo standard B14). Shape taken from searxng-mcp.
#
#   tree     every push and PR, working tree only. Stops a new secret landing.
#   history  weekly and on demand, full history. Finds one that already did.
#
# `history` needs `fetch-depth: 0`: the default depth of 1 scans one commit and
# reports green on a history full of secrets.
#
# Suppressions live in .gitleaksignore, by fingerprint.
name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tree:
    name: Working tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install gitleaks
        uses: ./.github/actions/install-gitleaks

      - name: Scan the working tree
        run: gitleaks dir . --no-banner --redact --verbose

  history:
    name: Full history
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        uses: ./.github/actions/install-gitleaks

      - name: Scan every commit
        run: gitleaks git . --no-banner --redact --verbose
