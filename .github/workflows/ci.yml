name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" ruff

      - name: Lint (ruff)
        run: ruff check dockhand_mcp tests

      # Floor is 85, against 87% actually achieved on this branch — measured in a
      # venv installed with `.[dev]` only, i.e. exactly what CI installs, because
      # the optional influxdb/nats/otel extras are absent here and a number taken
      # from a fully-provisioned dev venv would not transfer. Deliberately a
      # measured number with a small margin, not an aspirational one.
      - name: Test (pytest + coverage)
        run: |
          pytest -q \
            --cov=dockhand_mcp \
            --cov-report=term-missing \
            --cov-fail-under=85
