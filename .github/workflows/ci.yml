name: CI

on:
  push:
    branches: [main]
  pull_request:

# The repository default is broader than any job here needs; nothing in this
# workflow writes.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      # SHA-pinned per the Baseline bar — a tag is mutable and release.yml
      # already pinned, so the two workflows previously contradicted each other.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" ruff pip-audit

      - name: Lint (ruff)
        run: ruff check dockhand_mcp tests

      - name: Format check (ruff)
        run: ruff format --check .

      # `pip-audit .` resolves THIS project's dependencies rather than scanning
      # the ambient environment, so the gate does not go red because a runner
      # ships an old pip — verified by running it in a venv whose own pip
      # carried 7 advisories and still getting exit 0.
      #
      # This gate and the pyproject floors are one unit: the gate without the
      # floors lands red on 21 advisories, and the floors without the gate leave
      # nothing to stop the next drift.
      - name: Dependency audit (pip-audit)
        run: pip-audit --strict .

      # Floor is 85, against 88.7% actually achieved on this branch — measured in
      # a venv installed with `.[dev]` only, i.e. exactly what CI installs,
      # because the optional influxdb/nats/otel extras are absent here and a
      # number taken from a fully-provisioned dev venv would not transfer.
      # Deliberately a measured number with a small margin, not an aspirational one.
      - name: Test (pytest + coverage)
        run: |
          pytest -q \
            --cov=dockhand_mcp \
            --cov-report=term-missing \
            --cov-fail-under=85
