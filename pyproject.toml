[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dockhand-mcp"
version = "0.1.0"
description = "FastMCP Python MCP server wrapping the Dockhand REST API"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0",
    "httpx>=0.27",
    "pydantic>=2.0",
    "structlog>=24.0",
]

[project.optional-dependencies]
influxdb = ["influxdb3-python"]
otel = ["opentelemetry-sdk", "opentelemetry-exporter-otlp"]
nats = ["nats-py"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.20",
]

[project.scripts]
dockhand-mcp = "dockhand_mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dockhand_mcp*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
