[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dockhand-mcp"
version = "0.8.0"
description = "FastMCP Python MCP server wrapping the Dockhand REST API"
requires-python = ">=3.11"
dependencies = [
    # Floor AND ceiling on the same major: production runs 4.x, and a floor left
    # on 3.x would let CI and a fresh resolve land on different majors — the
    # vikunja#611 class of gap where the tested tree and the running tree are
    # different code. Dependabot's #10 widened only the ceiling (>=3.3,<5); this
    # moves both, so there is one major to test and one to deploy.
    "fastmcp>=4.0.11,<5",
    "httpx>=0.27",
    "pydantic>=2.0",
    "structlog>=24.0",

    # Transitive via fastmcp, pinned here only to hold them above their
    # advisories' fixed versions (vikunja#228). None of these is imported by
    # dockhand_mcp; they are declared so a resolve cannot land a vulnerable
    # version, and so the pip-audit CI gate has something to hold the line at.
    # Drop an entry once fastmcp's own floor is at or above it.
    "anyio>=4.14.2",            # PYSEC-2026-4024/4025
    "cryptography>=49.0.0",     # PYSEC-2026-3552/3553/3554, GHSA-537c-gmf6-5ccf
    "joserfc>=1.6.8",           # PYSEC-2026-2528
    "PyJWT>=2.15.0",            # PYSEC-2026-4140..4152, CVE-2026-102275
    "urllib3>=2.8.0",           # PYSEC-2026-4175/4176/4177
    "pydantic-settings>=2.14.2",  # GHSA-4xgf-cpjx-pc3j
    "python-multipart>=0.0.31",  # PYSEC-2026-3036/3037/3040
    "starlette>=1.3.1",         # PYSEC-2026-248/249
]

[project.optional-dependencies]
influxdb = ["influxdb3-python"]
otel = [
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp-proto-grpc>=1.20",
]
nats = ["nats-py"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.20",
    # In the lock, so CI lints and audits with the versions it was tested with.
    "ruff>=0.15",
    "pip-audit>=2.9",
]

[project.scripts]
dockhand-mcp = "dockhand_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["dockhand_mcp*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["dockhand_mcp"]

[tool.coverage.report]
# Measured 94% on 2026-10-25 (dockhand-mcp 0.8.0, 1225 statements, a venv with
# `.[dev]` only, i.e. what CI installs; the influxdb/nats/otel extras are absent).
# Floor = measured minus a small margin. ci.yml passes no --cov-fail-under of its
# own, so this is the one number (repo standard B9/F8).
fail_under = 90
show_missing = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# The repo standard's mandated families (P1).
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
